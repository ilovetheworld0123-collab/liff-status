<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ラファウ - ステータス＆記憶メモ</title>
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: #f0f4f8;
      color: #333;
      margin: 0;
      padding: 15px;
    }
    .container {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      max-width: 500px;
      margin: 0 auto;
    }
    h1 {
      font-size: 20px;
      color: #2c3e50;
      text-align: center;
      margin-bottom: 20px;
    }
    .status-box {
      background: #e8f4fd;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .status-item {
      margin: 5px 0;
      font-size: 15px;
    }
    .status-item span {
      font-weight: bold;
      color: #2980b9;
    }
    textarea {
      width: 100%;
      height: 250px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      resize: vertical;
      box-sizing: border-box;
      line-height: 1.5;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      transition: background 0.3s;
    }
    .btn-save {
      background-color: #27ae60;
      color: white;
    }
    .btn-save:hover {
      background-color: #219150;
    }
    .btn-complement {
      background-color: #8e44ad;
      color: white;
      margin-top: 10px;
    }
    .btn-complement:hover {
      background-color: #732d91;
    }
    .btn:disabled {
      background-color: #95a5a6;
      cursor: not-allowed;
    }
    #loading {
      text-align: center;
      font-weight: bold;
      color: #e67e22;
      display: none;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>📊 ステータス＆記憶メモ</h1>
    
    <div class="status-box">
      <div class="status-item">👤 名前: <span id="userName">読込中...</span></div>
      <div class="status-item">💖 好感度: <span id="trustScore">読込中...</span></div>
      <div class="status-item">📖 関係性: <span id="stageName">読込中...</span></div>
      <div class="status-item">🎭 機嫌: <span id="moodState">読込中...</span></div>
    </div>

    <h3>📝 共有記憶（メモ）</h3>
    <p style="font-size: 12px; color: #7f8c8d; margin-top: 0;">直接編集して保存することも可能です。</p>
    <textarea id="memoTextarea" placeholder="メモを読み込んでいます..."></textarea>
    
    <button id="saveBtn" class="btn btn-save" onclick="saveMemo()">手動でメモを上書き保存 💾</button>
    <button id="complementBtn" class="btn btn-complement" onclick="complementMemo()">過去の会話から記憶を補完する ✨</button>
    
    <div id="loading">処理中です。しばらくお待ちください... ⏳</div>
  </div>

  <!-- LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    // ==========================================
    // 🔑 設定（ご自身のものに書き換えてください）
    // ==========================================
    const LIFF_ID = "2011085090-Y3VoNpnw"; 
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwY-IBRG0C6Bn9RxsyWlMGpm0j43_8ap5pEeIOAMYNZvObbNkh4e0C88z4WPJmiRIGf/exec"; 
    
    let currentUserId = "";

    // LIFF初期化
    liff.init({ liffId: LIFF_ID })
      .then(() => {
        if (!liff.isLoggedIn()) {
          liff.login();
        } else {
          liff.getProfile().then(profile => {
            currentUserId = profile.userId;
            fetchData();
          });
        }
      })
      .catch(err => {
        console.error("LIFF Initialization failed", err);
        alert("LIFFの初期化に失敗しました。");
      });

    // データ取得（ステータス＆メモ）
    function fetchData() {
      fetch(`${GAS_URL}?userId=${currentUserId}&action=getAvatarData`) // ステータス読み込み用として代用可能ですが、基本のdoGetを叩きます
        .then(response => response.json())
        .then(data => {
          if(data.error) {
            alert(data.error);
            return;
          }
          // fallback的に、通常のステータス取得を再度行う
          return fetch(`${GAS_URL}?userId=${currentUserId}`);
        })
        .then(response => response.json())
        .then(data => {
          document.getElementById('userName').innerText = data.name || "名無し";
          document.getElementById('trustScore').innerText = data.trust;
          document.getElementById('stageName').innerText = data.stage;
          document.getElementById('moodState').innerText = data.isGrumpy ? "😡 不機嫌" : "😊 通常";
          document.getElementById('memoTextarea').value = data.memo;
        })
        .catch(error => {
          console.error('Error:', error);
          alert("データの読み込みに失敗しました。");
        });
    }

    // 手動でのメモ保存処理
    function saveMemo() {
      const newMemo = document.getElementById('memoTextarea').value;
      const btn = document.getElementById('saveBtn');
      btn.innerText = "保存中... ⏳";
      btn.disabled = true;

      fetch(`${GAS_URL}?userId=${currentUserId}&action=updateMemo&param=${encodeURIComponent(newMemo)}`)
        .then(response => response.json())
        .then(data => {
          alert("メモを手動保存しました！");
          btn.innerText = "手動でメモを上書き保存 💾";
          btn.disabled = false;
        })
        .catch(err => {
          alert("保存エラー");
          btn.innerText = "手動でメモを上書き保存 💾";
          btn.disabled = false;
        });
    }

    // 🟢 追加：過去の会話から記憶を補完する魔法の処理
    function complementMemo() {
      const isConfirm = confirm("過去の会話履歴をAIが読み込み、メモに不足している設定や思い出を自動で追記します。数十秒かかる場合がありますが、実行しますか？");
      if(!isConfirm) return;

      const btn = document.getElementById('complementBtn');
      const saveBtn = document.getElementById('saveBtn');
      const loading = document.getElementById('loading');
      
      btn.disabled = true;
      saveBtn.disabled = true;
      btn.style.backgroundColor = "#95a5a6";
      loading.style.display = "block";

      fetch(`${GAS_URL}?userId=${currentUserId}&action=complementMemo`)
        .then(response => response.json())
        .then(data => {
          loading.style.display = "none";
          btn.disabled = false;
          saveBtn.disabled = false;
          btn.style.backgroundColor = "#8e44ad";

          if(data.error) {
            alert("エラー: " + data.error);
          } else if(data.success) {
            document.getElementById('memoTextarea').value = data.memo;
            alert("✨ メモの補完が完了しました！\n\nAIが過去の会話から大事な設定を拾い上げて追記しました。内容を確認してください。");
          }
        })
        .catch(err => {
          loading.style.display = "none";
          btn.disabled = false;
          saveBtn.disabled = false;
          btn.style.backgroundColor = "#8e44ad";
          alert("通信エラーが発生しました。時間を置いて再度お試しください。");
        });
    }
  </script>
</body>
</html>
