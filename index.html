<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ステータス＆メモ管理</title>
  <style>
    body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #1a1a1a; color: #f0f0f0; padding: 20px; box-sizing: border-box; }
    .card { background-color: #2c2c2c; border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border-left: 5px solid #4a90e2; }
    h2 { margin-top: 0; color: #4a90e2; font-size: 18px; border-bottom: 1px solid #444; padding-bottom: 10px; }
    .status-item { margin: 10px 0; font-size: 16px; }
    .label { color: #aaa; font-size: 14px; }
    
    /* タブ切り替えボタン */
    .tab-container { display: flex; margin-bottom: 15px; border-bottom: 2px solid #444; }
    .tab-btn { flex: 1; background: none; border: none; padding: 10px; color: #aaa; font-size: 14px; font-weight: bold; cursor: pointer; text-align: center; }
    .tab-btn.active { color: #4a90e2; border-bottom: 2px solid #4a90e2; margin-bottom: -2px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* 直接編集できるテキストエリア */
    .memo-textarea { width: 100%; height: 180px; padding: 12px; border-radius: 5px; border: 1px solid #444; background-color: #1e1e1e; color: #dcdcdc; font-size: 14px; box-sizing: border-box; resize: vertical; line-height: 1.5; }
    
    /* 変更・削除履歴リスト */
    .memo-list { list-style: none; padding: 0; margin: 0; }
    .memo-item { background-color: #1e1e1e; padding: 10px 12px; margin-bottom: 8px; border-radius: 5px; border: 1px solid #444; font-size: 13px; color: #aaa; word-break: break-all; white-space: pre-wrap; }

    .btn { display: block; width: 100%; padding: 12px; margin: 10px 0; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; color: white; cursor: pointer; }
    .btn-save { background-color: #27ae60; margin-top: 15px; }
    .btn-close { background-color: #7f8c8d; }
    #loading { text-align: center; color: #aaa; margin-top: 50px; }
    #error-box { display: none; background-color: #e74c3c; color: white; padding: 15px; border-radius: 5px; margin-top: 20px; font-size: 14px; }
    #content { display: none; }
  </style>
</head>
<body>
  <script>
    const MY_LIFF_ID = "2011085090-Y3VoNpnw";
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwloEObQeewdmGNxr-BVujiQWGMSVmiJ75hzqEnz5AfUaAj3L_EY9Kc-UuagOHwtIBX/exec";
  </script>

  <div id="loading">📡 起動中...</div>
  <div id="error-box"></div>

  <div id="content">
    <div class="card">
      <h2>📊 <span id="userName"></span> さんのステータス</h2>
      <div class="status-item"><span class="label">好感度スコア:</span> <strong id="trustScore" style="color: #f1c40f;"></strong></div>
      <div class="status-item"><span class="label">現在の関係:</span> <strong id="stageName"></strong></div>
      <div class="status-item"><span class="label">ラファウの機嫌:</span> <strong id="mood"></strong></div>
    </div>

    <div class="card">
      <h2>📝 記憶メモ直接編集</h2>
      
      <!-- タブ切り替えボタン -->
      <div class="tab-container">
        <button class="tab-btn active" onclick="switchTab('active')">メモ編集</button>
        <button class="tab-btn" onclick="switchTab('history')">変更履歴 (<span id="historyCount">0</span>)</button>
      </div>

      <!-- タブ1：直接編集テキストエリア -->
      <div id="tab-active" class="tab-content active">
        <textarea id="memoTextarea" class="memo-textarea" placeholder="ここに記憶メモが表示されます..."></textarea>
        <button class="btn btn-save" onclick="saveMemo()">💾 変更を保存する</button>
      </div>

      <!-- タブ2：変更したメモの履歴（直近5件） -->
      <div id="tab-history" class="tab-content">
        <ul class="memo-list" id="historyListContainer"></ul>
      </div>
    </div>

    <button class="btn btn-close" onclick="liff.closeWindow()">✖️ 画面を閉じる</button>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    let myUserId = "";

    function showError(message) {
      document.getElementById("loading").style.display = "none";
      const errorBox = document.getElementById("error-box");
      errorBox.style.display = "block";
      errorBox.innerHTML = "⚠️ <b>エラーが発生しました</b><br><br>" + message;
    }

    document.addEventListener("DOMContentLoaded", () => {
      liff.init({ liffId: MY_LIFF_ID }).then(() => {
        if (!liff.isLoggedIn()) {
          liff.login();
        } else {
          liff.getProfile().then(profile => {
            myUserId = profile.userId;
            fetchData('load');
          }).catch(err => showError("プロフィール取得エラー: " + err.message));
        }
      }).catch(err => showError("LIFF初期化エラー: " + err.message));
    });

    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      
      if (tabName === 'active') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('tab-active').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('tab-history').classList.add('active');
      }
    }

    function fetchData(action, newMemoParam = "") {
      document.getElementById("content").style.display = "none";
      document.getElementById("loading").style.display = "block";
      document.getElementById("loading").innerHTML = "📡 通信中...";

      let url = GAS_API_URL + "?userId=" + myUserId + "&action=" + action;
      if (newMemoParam !== "") {
        url += "&param=" + encodeURIComponent(newMemoParam);
      }

      fetch(url)
        .then(response => response.json())
        .then(data => {
          if (data.error) {
            showError(data.error);
            return;
          }
          document.getElementById("userName").textContent = data.name;
          document.getElementById("trustScore").textContent = data.trust;
          document.getElementById("stageName").textContent = data.stage;
          document.getElementById("mood").textContent = data.isGrumpy ? "😡 不機嫌" : "😊 通常";

          // テキストエリアに流し込む
          document.getElementById("memoTextarea").value = data.memo || "";

          // 履歴リストの描画
          renderHistory(data.history);

          document.getElementById("loading").style.display = "none";
          document.getElementById("content").style.display = "block";
        })
        .catch(err => showError("GAS通信エラー: " + err.message));
    }

    function renderHistory(historyString) {
      const container = document.getElementById("historyListContainer");
      container.innerHTML = "";

      const historyArray = historyString ? historyString.split('---SPLIT---').filter(h => h.trim() !== "") : [];

      if (historyArray.length === 0) {
        container.innerHTML = '<li style="color: #7f8c8d; text-align: center; padding: 10px;">変更履歴はありません。</li>';
      } else {
        historyArray.forEach((hist) => {
          const li = document.createElement("li");
          li.className = "memo-item";
          li.textContent = hist;
          container.appendChild(li);
        });
      }
      document.getElementById("historyCount").textContent = historyArray.length;
    }

    function saveMemo() {
      const updatedMemo = document.getElementById("memoTextarea").value.trim();
      if (!confirm("この内容でメモを保存しますか？")) return;
      fetchData('updateMemo', updatedMemo);
    }
  </script>
</body>
</html>
