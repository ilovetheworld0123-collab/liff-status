<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ラファウ - ステータス＆記憶メモ</title>
  <style>
    /* 🌌 宇宙背景と基本設定 */
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      margin: 0;
      padding: 15px;
      background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
      color: #e2e8f0;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ✨ 星の瞬きアニメーション */
    @keyframes twinkle {
      0% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.1); }
      100% { opacity: 0.3; transform: scale(1); }
    }
    .star-bg {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-image: 
        radial-gradient(1px 1px at 20px 30px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 60px 80px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 130px 40px, #e0f2fe, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 190px 150px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 250px 90px, #fef08a, rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 300px 300px;
      animation: twinkle 5s infinite ease-in-out;
      z-index: -1;
    }

    /* 📦 グラスモーフィズム調のコンテナ */
    .container {
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      max-width: 500px;
      margin: 0 auto;
      position: relative;
    }

    h1 { 
      font-size: 20px; 
      color: #7dd3fc; 
      text-align: center; 
      margin-top: 5px;
      margin-bottom: 20px; 
      text-shadow: 0 0 10px rgba(125, 211, 252, 0.3); 
    }
    h3 { 
      font-size: 16px; 
      color: #fde047; 
      margin-top: 25px; 
      margin-bottom: 5px; 
      border-bottom: 1px solid rgba(253, 224, 71, 0.2);
      padding-bottom: 8px;
    }

    /* 🖼️ 立ち絵＆体温バッジエリア */
    .avatar-card {
      text-align: center;
      margin-bottom: 15px;
      background: rgba(15, 23, 42, 0.4);
      padding: 15px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .rafau-img {
      width: 170px;
      height: auto;
      margin: 10px auto;
      display: block;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));
      transition: all 0.3s ease;
    }
    .temp-badge {
      display: inline-block;
      padding: 5px 14px;
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: #ffffff;
      font-weight: bold;
      border-radius: 20px;
      font-size: 14px;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
      animation: pulse 2s infinite;
    }
    .temp-badge.normal-badge {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
      animation: none;
    }
    
    /* 📊 ステータス */
    .status-box { 
      background: rgba(59, 130, 246, 0.1); 
      border: 1px solid rgba(59, 130, 246, 0.3); 
      padding: 15px; 
      border-radius: 12px; 
      margin-bottom: 20px; 
      box-shadow: inset 0 0 20px rgba(59, 130, 246, 0.05);
    }
    .status-item { margin: 6px 0; font-size: 15px; color: #cbd5e1; }
    .status-item span { font-weight: bold; color: #38bdf8; text-shadow: 0 0 5px rgba(56, 189, 248, 0.3); }

    /* 📂 コントロールボックス */
    .control-box { 
      background: rgba(30, 41, 59, 0.7); 
      padding: 15px; 
      border-radius: 12px; 
      margin-bottom: 20px; 
      border: 1px solid rgba(255, 255, 255, 0.1); 
      font-size: 13px;
      color: #e2e8f0; 
    }
    .control-box select { 
      width: 100%; 
      padding: 10px; 
      margin-top: 8px; 
      border-radius: 8px; 
      border: 1px solid rgba(255,255,255,0.2); 
      background: rgba(15, 23, 42, 0.9); 
      color: #e2e8f0; 
      font-size: 14px; 
      outline: none;
    }
    .control-box select:focus { border-color: #38bdf8; }

    /* 🏷️ タブ切り替え */
    .tabs {
      display: flex;
      gap: 5px;
      margin-top: 15px;
      margin-bottom: 0;
    }
    .tab-btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-bottom: none;
      padding: 12px 5px;
      color: #94a3b8;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 10px 10px 0 0;
      transition: all 0.3s ease;
    }
    .tab-btn:hover { background: rgba(255, 255, 255, 0.1); color: #e2e8f0; }
    .tab-btn.active {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid #38bdf8;
      border-bottom: 1px solid rgba(56, 189, 248, 0.15);
      box-shadow: 0 -4px 15px rgba(56, 189, 248, 0.1);
    }
    .tab-content { display: none; animation: fadeIn 0.4s ease; }
    .tab-content.active { display: block; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* 📝 エディタ（ガラス風） */
    .editor {
      width: 100%;
      height: 180px;
      padding: 15px;
      border: 1px solid #38bdf8;
      border-radius: 0 10px 10px 10px;
      font-size: 14px;
      box-sizing: border-box;
      line-height: 1.7;
      background-color: rgba(15, 23, 42, 0.5);
      color: #e2e8f0;
      overflow-y: auto;
      outline: none;
      transition: background-color 0.3s, box-shadow 0.3s;
    }
    .editor:focus { 
      background-color: rgba(15, 23, 42, 0.8); 
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.2); 
    }

    /* カスタムスクロールバー */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 10px; }
    ::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.4); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(56, 189, 248, 0.8); }

    /* 🔘 ボタン各種 */
    .btn {
      display: block; 
      width: 100%; 
      padding: 14px; 
      margin-top: 12px; 
      border: none;
      border-radius: 10px; 
      font-size: 14px; 
      font-weight: bold; 
      cursor: pointer; 
      text-align: center; 
      transition: all 0.2s ease;
      color: white; 
      text-shadow: 0 1px 2px rgba(0,0,0,0.4);
    }
    .btn:active { transform: scale(0.98); }
    
    .btn-save { background: linear-gradient(135deg, #10b981 0%, #059669 100%); box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3); }
    .btn-save:hover { background: linear-gradient(135deg, #059669 0%, #047857 100%); }
    
    .btn-complement { background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%); box-shadow: 0 4px 10px rgba(139, 92, 246, 0.3); margin-top: 25px; }
    .btn-complement:hover { background: linear-gradient(135deg, #7c3aed 0%, #5b21b6 100%); }
    
    .btn-clean { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); box-shadow: 0 4px 10px rgba(245, 158, 11, 0.3); }
    .btn-clean:hover { background: linear-gradient(135deg, #d97706 0%, #b45309 100%); }
    
    .btn:disabled { background: #475569; color: #94a3b8; box-shadow: none; cursor: not-allowed; text-shadow: none; }
    
    #loading { text-align: center; font-weight: bold; color: #7dd3fc; display: none; margin-top: 20px; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }

    .help-text { font-size: 12px; color: #94a3b8; margin-top: 0; margin-bottom: 10px; }
  </style>
</head>
<body>

  <!-- 宇宙背景 -->
  <div class="star-bg"></div>

  <div class="container">
    <h1>🔭 ステータス＆記憶メモ</h1>
    
    <!-- 🖼️ 立ち絵・体温表示エリア -->
    <div class="avatar-card">
      <div id="tempBadge" class="temp-badge normal-badge">平熱（36.5℃）</div>
      <img id="rafauImg" class="rafau-img" src="" alt="ラファウ">
    </div>

    <div class="status-box">
      <div class="status-item">👤 名前: <span id="userName">読込中...</span></div>
      <div class="status-item">💖 好感度: <span id="trustScore">読込中...</span></div>
      <div class="status-item">📖 関係性: <span id="stageName">読込中...</span></div>
      <div class="status-item">🎭 機嫌: <span id="moodState">読込中...</span></div>
    </div>

    <!-- 🟢 参照するヒストリー（シート）を選ぶコントロール -->
    <div class="control-box">
      <label for="sheetSelect">📂 <b>補完で読み込む会話シートを選択:</b></label>
      <select id="sheetSelect">
        <option value="History">History (直近の最新)</option>
      </select>
    </div>

    <h3>📝 共有記憶（メモ）</h3>
    <p class="help-text">直接編集可能です。追加・変更部分は赤字でハイライトされます。</p>

    <!-- タブボタン -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('tab1', this)">ユーザー</button>
      <button class="tab-btn" onclick="switchTab('tab2', this)">ラファウ</button>
      <button class="tab-btn" onclick="switchTab('tab3', this)">思い出</button>
      <button class="tab-btn" onclick="switchTab('tab4', this)">現在地</button>
    </div>

    <!-- 各タブの中身 -->
    <div id="tab1" class="tab-content active"><div id="editor-user" class="editor" contenteditable="true">読込中...</div></div>
    <div id="tab2" class="tab-content"><div id="editor-rafau" class="editor" contenteditable="true">読込中...</div></div>
    <div id="tab3" class="tab-content"><div id="editor-mems" class="editor" contenteditable="true">読込中...</div></div>
    <div id="tab4" class="tab-content"><div id="editor-curE" class="editor" contenteditable="true">読込中...</div></div>
    
    <button id="saveBtn" class="btn btn-save" onclick="saveMemo()">手動でメモを上書き保存 💾</button>
    
    <button id="complementBtn" class="btn btn-complement" onclick="complementMemo()">選択したシートから記憶を補完する ✨</button>
    <button id="cleanBtn" class="btn btn-clean" onclick="cleanMemo()">メモの重複項目の整理・統合を行う 🧹</button>
    
    <div id="loading">📡 宇宙と通信処理中です... ⏳</div>
  </div>

  <!-- LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    const LIFF_ID = "2011085090-Y3VoNpnw"; 
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwMFWZJ7i-6B45cY-WYdW_4FNbF_p1I7kbH5Cr5eulA5IcOJkVZv1AN4FsrrjGtoj7g/exec";
    
    // 🖼️ 指定いただいたImgurの体温別立ち絵URL
    const IMG_FEVER_40 = "https://i.imgur.com/CNPGgyT.png"; // 40.0℃〜（重症）
    const IMG_FEVER_38 = "https://i.imgur.com/4X3lG8c.png"; // 38.0℃〜39.9℃（高熱）
    const IMG_FEVER_36 = "https://i.imgur.com/pQ7wCWD.png"; // 36.6℃〜37.9℃（微熱）
    const IMG_NORMAL   = "https://i.imgur.com/Y2uKVeM.png"; // 36.5℃（平熱）

    let currentUserId = "";
    let currentMemoData = { userP: "", rafauP: "", mems: "", curE: "" };

    liff.init({ liffId: LIFF_ID })
      .then(() => {
        if (!liff.isLoggedIn()) {
          liff.login();
        } else {
          liff.getProfile().then(profile => {
            currentUserId = profile.userId;
            fetchData();
          });
        }
      })
      .catch(err => { alert("LIFFの初期化に失敗しました。"); });

    function switchTab(tabId, btnElement) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btnElement.classList.add('active');
    }

    function parseMemoClient(text) {
      let userP = (text.match(/【ユーザープロフィール】\s*([\s\S]*?)(?=【ラファウプロフィール】|【特別な思い出】|【現在起きていること】|$)/) || ["", ""])[1].trim();
      let rafauP = (text.match(/【ラファウプロフィール】\s*([\s\S]*?)(?=【ユーザープロフィール】|【特別な思い出】|【現在起きていること】|$)/) || ["", ""])[1].trim();
      let mems = (text.match(/【特別な思い出】\s*([\s\S]*?)(?=【ユーザープロフィール】|【ラファウプロフィール】|【現在起きていること】|$)/) || ["", ""])[1].trim();
      let curE = (text.match(/【現在起きていること】\s*([\s\S]*?)(?=【ユーザープロフィール】|【ラファウプロフィール】|【特別な思い出】|$)/) || ["", ""])[1].trim();
      return { userP, rafauP, mems, curE };
    }

    function highlightDiff(oldText, newText) {
      const oldLines = oldText.split('\n').map(l => l.trim()).filter(l => l);
      const newLines = newText.split('\n');
      return newLines.map(line => {
        const trimmed = line.trim();
        if (trimmed && !oldLines.includes(trimmed)) {
          return `<span style="color: #ff8787; font-weight: bold;">${line}</span><br>`;
        }
        return `${line}<br>`;
      }).join('');
    }

    function fetchData() {
      fetch(`${GAS_URL}?userId=${currentUserId}&action=getAvatarData`) 
        .then(response => response.json())
        .then(data => {
          if(data.error) throw new Error(data.error);
          
          if(data.sheets && data.sheets.length > 0) {
            const select = document.getElementById('sheetSelect');
            select.innerHTML = "";
            data.sheets.forEach(sheetName => {
              let opt = document.createElement('option');
              opt.value = sheetName;
              opt.innerText = sheetName === 'History' ? 'History (直近の最新)' : sheetName + ' (過去のアーカイブ)';
              select.appendChild(opt);
            });
          }

          return fetch(`${GAS_URL}?userId=${currentUserId}`);
        })
        .then(response => response.json())
        .then(data => {
          document.getElementById('userName').innerText = data.name || "名無し";
          document.getElementById('trustScore').innerText = data.trust;
          document.getElementById('stageName').innerText = data.stage;
          document.getElementById('moodState').innerText = data.isGrumpy ? "😡 不機嫌" : "😊 通常";
          
          // 🌡️ 体温と立ち絵画像のリアルタイム更新処理
          const temp = data.feverTemp || 36.5;
          const imgEl = document.getElementById('rafauImg');
          const badgeEl = document.getElementById('tempBadge');

          if (temp > 36.5) {
            badgeEl.innerText = `風邪（${temp.toFixed(1)}℃）`;
            badgeEl.className = "temp-badge";

            if (temp >= 40.0) imgEl.src = IMG_FEVER_40;
            else if (temp >= 38.0) imgEl.src = IMG_FEVER_38;
            else imgEl.src = IMG_FEVER_36;
          } else {
            badgeEl.innerText = "平熱（36.5℃）";
            badgeEl.className = "temp-badge normal-badge";
            imgEl.src = IMG_NORMAL;
          }

          currentMemoData = parseMemoClient(data.memo);
          document.getElementById('editor-user').innerText = currentMemoData.userP;
          document.getElementById('editor-rafau').innerText = currentMemoData.rafauP;
          document.getElementById('editor-mems').innerText = currentMemoData.mems;
          document.getElementById('editor-curE').innerText = currentMemoData.curE;
        })
        .catch(error => { alert("データの読み込みに失敗しました。"); });
    }

    function saveMemo() {
      const btn = document.getElementById('saveBtn');
      btn.innerText = "保存中... ⏳"; btn.disabled = true;

      const userP = document.getElementById('editor-user').innerText;
      const rafauP = document.getElementById('editor-rafau').innerText;
      const mems = document.getElementById('editor-mems').innerText;
      const curE = document.getElementById('editor-curE').innerText;

      const newFullMemo = `【ユーザープロフィール】\n${userP}\n\n【ラファウプロフィール】\n${rafauP}\n\n【特別な思い出】\n${mems}\n\n【現在起きていること】\n${curE}`;

      fetch(GAS_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded'
        },
        body: new URLSearchParams({
          userId: currentUserId,
          action: 'updateMemo',
          param: newFullMemo
        }).toString()
      })
        .then(response => response.json())
        .then(data => {
          if (data.error) throw new Error(data.error);
          alert("メモを手動保存しました！");
          currentMemoData = parseMemoClient(newFullMemo);
          document.getElementById('editor-user').innerText = currentMemoData.userP;
          document.getElementById('editor-rafau').innerText = currentMemoData.rafauP;
          document.getElementById('editor-mems').innerText = currentMemoData.mems;
          document.getElementById('editor-curE').innerText = currentMemoData.curE;
          btn.innerText = "手動でメモを上書き保存 💾"; btn.disabled = false;
        })
        .catch(err => { 
          alert("保存エラー：通信に失敗しました"); 
          btn.innerText = "手動でメモを上書き保存 💾"; 
          btn.disabled = false; 
        });
    }

    function complementMemo() {
      const selectedSheet = document.getElementById('sheetSelect').value;
      const isConfirm = confirm(`「${selectedSheet}」の会話履歴を読み込んでメモを補完します。実行しますか？`);
      if(!isConfirm) return;

      const btn = document.getElementById('complementBtn');
      const cleanBtn = document.getElementById('cleanBtn');
      const saveBtn = document.getElementById('saveBtn');
      const loading = document.getElementById('loading');
      
      btn.disabled = true; cleanBtn.disabled = true; saveBtn.disabled = true;
      loading.style.display = "block";

      fetch(`${GAS_URL}?userId=${currentUserId}&action=complementMemo&param=${encodeURIComponent(selectedSheet)}`)
        .then(response => response.json())
        .then(data => {
          loading.style.display = "none";
          btn.disabled = false; cleanBtn.disabled = false; saveBtn.disabled = false;

          if(data.error) {
            alert("エラー: " + data.error);
          } else if(data.success) {
            const newMemoData = parseMemoClient(data.memo);
            document.getElementById('editor-user').innerHTML = highlightDiff(currentMemoData.userP, newMemoData.userP);
            document.getElementById('editor-rafau').innerHTML = highlightDiff(currentMemoData.rafauP, newMemoData.rafauP);
            document.getElementById('editor-mems').innerHTML = highlightDiff(currentMemoData.mems, newMemoData.mems);
            document.getElementById('editor-curE').innerHTML = highlightDiff(currentMemoData.curE, newMemoData.curE);
            currentMemoData = newMemoData;
            alert("✨ 記憶の補完が完了しました！赤字部分を確認して保存してください。");
          }
        })
        .catch(err => {
          loading.style.display = "none";
          btn.disabled = false; cleanBtn.disabled = false; saveBtn.disabled = false;
          alert("通信エラーが発生しました。");
        });
    }

    function cleanMemo() {
      const isConfirm = confirm("現在のメモにある重複項目や似たような記述を綺麗に整理・統合します。実行しますか？");
      if(!isConfirm) return;

      const btn = document.getElementById('complementBtn');
      const cleanBtn = document.getElementById('cleanBtn');
      const saveBtn = document.getElementById('saveBtn');
      const loading = document.getElementById('loading');
      
      btn.disabled = true; cleanBtn.disabled = true; saveBtn.disabled = true;
      loading.style.display = "block";

      fetch(`${GAS_URL}?userId=${currentUserId}&action=cleanMemo`)
        .then(response => response.json())
        .then(data => {
          loading.style.display = "none";
          btn.disabled = false; cleanBtn.disabled = false; saveBtn.disabled = false;

          if(data.error) {
            alert("エラー: " + data.error);
          } else if(data.success) {
            const newMemoData = parseMemoClient(data.memo);
            document.getElementById('editor-user').innerHTML = highlightDiff(currentMemoData.userP, newMemoData.userP);
            document.getElementById('editor-rafau').innerHTML = highlightDiff(currentMemoData.rafauP, newMemoData.rafauP);
            document.getElementById('editor-mems').innerHTML = highlightDiff(currentMemoData.mems, newMemoData.mems);
            document.getElementById('editor-curE').innerHTML = highlightDiff(currentMemoData.curE, newMemoData.curE);
            currentMemoData = newMemoData;
            alert("🧹 重複項目の整理・統合が完了しました！内容を確認して保存してください。");
          }
        })
        .catch(err => {
          loading.style.display = "none";
          btn.disabled = false; cleanBtn.disabled = false; saveBtn.disabled = false;
          alert("通信エラーが発生しました。");
        });
    }
  </script>
</body>
</html>
