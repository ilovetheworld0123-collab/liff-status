<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ラファウの音声プレイヤー</title>
    <!-- LINE Front-end Framework (LIFF) SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body {
            background-color: #1e1f24;
            color: #f0f2f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background-color: #2b2d35;
            border-radius: 16px;
            padding: 30px 20px;
            width: 100%;
            max-width: 320px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            border: 1px solid #3f424e;
        }
        h2 {
            font-size: 1.1rem;
            margin-bottom: 8px;
            color: #d1d5db;
        }
        p {
            font-size: 0.85rem;
            color: #9ca3af;
            margin-bottom: 24px;
        }
        .play-btn {
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 50%;
            width: 72px;
            height: 72px;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4);
            transition: transform 0.1s, background-color 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .play-btn:active {
            transform: scale(0.95);
        }
        .play-btn:hover {
            background-color: #4338ca;
        }
        .status {
            margin-top: 16px;
            font-size: 0.8rem;
            color: #9ca3af;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>ラファウの音声解説</h2>
        <p id="sub-text">ボタンを押して声を聴く</p>
        
        <button id="playBtn" class="play-btn" onclick="togglePlay()">▶</button>
        <div id="status" class="status">読み込み中...</div>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        // ご自身のGASのウェブアプリURL（doGetが動くURL）に書き換えてください
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwMFWZJ7i-6B45cY-WYdW_4FNbF_p1I7kbH5Cr5eulA5IcOJkVZv1AN4FsrrjGtoj7g/exec";

        let audioPlayer = document.getElementById('audioPlayer');
        let playBtn = document.getElementById('playBtn');
        let statusText = document.getElementById('status');
        let audioUrl = "";

        // LIFF初期化
        window.onload = async function() {
            try {
                await liff.init({ liffId: "2011085090-hlcuTQzK" });
                
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }

                const context = liff.getContext();
                const userId = context ? context.userId : "";

                if (!userId) {
                    statusText.innerText = "ユーザーIDが取得できませんでした";
                    return;
                }

                // GASから最新の音声URLを取得
                let res = await fetch(`${GAS_WEB_APP_URL}?action=getLatestAudio&userId=${userId}`);
                let textData = await res.text(); // まずテキストとして受け取る
                
                let data;
                try {
                    data = JSON.parse(textData); // JSONに変換を試みる
                } catch (e) {
                    console.error("受け取ったデータ:", textData);
                    statusText.innerText = "サーバーエラー: 応答が不正です";
                    return;
                }

                if (data.success && data.audioUrl) {
                    audioUrl = data.audioUrl;
                    audioPlayer.src = audioUrl;
                    statusText.innerText = "再生準備完了";
                } else {
                    statusText.innerText = "直近の音声データがありません";
                    playBtn.disabled = true;
                    playBtn.style.opacity = 0.5;
                }

            } catch (err) {
                statusText.innerText = "初期化エラー: " + err.message;
            }
        };
        function togglePlay() {
            if (!audioUrl) return;

            if (audioPlayer.paused) {
                audioPlayer.play().then(() => {
                    playBtn.innerText = "⏸";
                    statusText.innerText = "再生中...";
                }).catch(e => {
                    statusText.innerText = "再生失敗";
                });
            } else {
                audioPlayer.pause();
                playBtn.innerText = "▶";
                statusText.innerText = "一時停止";
            }
        }

        audioPlayer.onended = function() {
            playBtn.innerText = "▶";
            statusText.innerText = "再生終了";
        };
    </script>
</body>
</html>
