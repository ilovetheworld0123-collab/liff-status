<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アイテムショップ ＆ 特殊効果</title>
  <style>
    /* 🌌 宇宙背景と基本設定 */
    body { 
      font-family: 'Helvetica Neue', Arial, sans-serif; 
      margin: 0; 
      padding: 20px; 
      box-sizing: border-box; 
      background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
      color: #e2e8f0;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ✨ 星の瞬きアニメーション */
    @keyframes twinkle {
      0% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.1); }
      100% { opacity: 0.3; transform: scale(1); }
    }
    .star-bg {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-image: 
        radial-gradient(1px 1px at 20px 30px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 60px 80px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 130px 40px, #e0f2fe, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 190px 150px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 250px 90px, #fef08a, rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 300px 300px;
      animation: twinkle 5s infinite ease-in-out;
      z-index: -1;
    }

    /* 📦 グラスモーフィズム調のカード */
    .card { 
      background: rgba(15, 23, 42, 0.6); 
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1); 
      border-radius: 16px; 
      padding: 20px; 
      margin-bottom: 20px; 
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); 
    }
    h2 { 
      margin-top: 0; 
      color: #7dd3fc; 
      font-size: 18px; 
      border-bottom: 1px solid rgba(125, 211, 252, 0.2); 
      padding-bottom: 12px; 
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    /* 📊 ステータス */
    .status-item { margin: 10px 0; font-size: 15px; }
    .label { color: #94a3b8; font-size: 13px; }
    #userTrust { color: #fde047; text-shadow: 0 0 8px rgba(253, 224, 71, 0.5); font-size: 18px; }

    /* 🏷️ タブデザイン */
    .tab-container { display: flex; gap: 8px; margin-bottom: 20px; }
    .tab-btn { 
      flex: 1; 
      background: rgba(255, 255, 255, 0.05); 
      border: 1px solid rgba(255, 255, 255, 0.1); 
      padding: 12px; 
      color: #94a3b8; 
      font-size: 13px; 
      font-weight: bold; 
      cursor: pointer; 
      text-align: center; 
      border-radius: 10px;
      transition: all 0.3s ease;
    }
    .tab-btn.active { 
      background: rgba(56, 189, 248, 0.15); 
      color: #38bdf8; 
      border: 1px solid #38bdf8; 
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
    }
    .tab-content { display: none; animation: fadeIn 0.4s ease; }
    .tab-content.active { display: block; }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    /* ⚡ 発動中エフェクト枠 */
    .active-effect-box { 
      background: rgba(59, 130, 246, 0.1); 
      border: 1px solid #3b82f6; 
      border-radius: 12px; 
      padding: 16px; 
      margin-bottom: 15px; 
      text-align: center; 
      box-shadow: inset 0 0 20px rgba(59, 130, 246, 0.1);
    }
    #activeEffectText { font-size: 15px; font-weight: bold; color: #60a5fa; margin-bottom: 12px; text-shadow: 0 0 5px rgba(96, 165, 250, 0.5); }
    
    /* 🛍️ アイテムグリッド */
    .item-grid { 
      display: grid; 
      grid-template-columns: repeat(2, 1fr); 
      gap: 12px; 
      max-height: 450px; 
      overflow-y: auto; 
      padding-right: 5px; 
    }
    
    /* カスタムスクロールバー */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 10px; }
    ::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.4); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(56, 189, 248, 0.8); }

    .item-card { 
      background: rgba(30, 41, 59, 0.7); 
      border: 1px solid rgba(255, 255, 255, 0.08); 
      border-radius: 12px; 
      padding: 14px; 
      text-align: center; 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    }
    .item-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
      border-color: rgba(125, 211, 252, 0.4);
    }
    .item-name { font-size: 14px; font-weight: bold; margin-bottom: 6px; color: #f8fafc; }
    .item-desc { font-size: 11px; color: #cbd5e1; margin-bottom: 10px; line-height: 1.4; flex-grow: 1; }
    .item-price { font-size: 13px; color: #fde047; margin-bottom: 12px; font-weight: bold; }

    /* 🔘 ボタン各種 */
    .btn { 
      display: block; 
      width: 100%; 
      padding: 10px; 
      margin: 5px 0; 
      border: none; 
      border-radius: 8px; 
      font-size: 13px; 
      font-weight: bold; 
      color: white; 
      cursor: pointer; 
      transition: all 0.2s ease;
      text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }
    .btn:active { transform: scale(0.97); }
    
    .btn-buy { background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%); box-shadow: 0 4px 10px rgba(99, 102, 241, 0.3); }
    .btn-buy:hover { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); }
    
    .btn-use { background: linear-gradient(135deg, #0ea5e9 0%, #10b981 100%); box-shadow: 0 4px 10px rgba(14, 165, 233, 0.3); }
    .btn-use:hover { background: linear-gradient(135deg, #0284c7 0%, #059669 100%); }
    
    .btn-clear { background: transparent; border: 1px solid #ef4444; color: #fca5a5; box-shadow: 0 4px 10px rgba(239, 68, 68, 0.1); }
    .btn-clear:hover { background: rgba(239, 68, 68, 0.15); }
    
    .btn-close { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255,255,255,0.2); margin-top: 25px; color: #cbd5e1; }
    .btn-close:hover { background: rgba(255, 255, 255, 0.2); }

    /* 📡 ローディング・エラー */
    #loading { text-align: center; color: #7dd3fc; margin-top: 50px; font-weight: bold; font-size: 15px; animation: pulse 2s infinite; }
    @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
    
    #error-box { display: none; background-color: rgba(220, 38, 38, 0.9); color: white; padding: 15px; border-radius: 10px; margin-top: 20px; font-size: 14px; word-break: break-all; border: 1px solid #f87171; }
    #content { display: none; }
  </style>
</head>
<body>
  <!-- 宇宙背景 -->
  <div class="star-bg"></div>

  <script>
    const MY_LIFF_ID = "2011108007-kQlpYXHL";
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwY-IBRG0C6Bn9RxsyWlMGpm0j43_8ap5pEeIOAMYNZvObbNkh4e0C88z4WPJmiRIGf/exec";
  </script>

  <div id="loading">🔭 宇宙との通信を確立中...</div>
  <div id="error-box"></div>

  <div id="content">
    <div class="card">
      <h2>🌌 特殊アイテム・効果管理</h2>
      <div class="status-item"><span class="label">所持ポイント:</span> <strong id="userTrust">0</strong> pt</div>
      
      <div class="active-effect-box">
        <div style="font-size: 12px; color: #94a3b8; margin-bottom: 8px;">現在の有効な効果：</div>
        <div id="activeEffectText">なし（通常状態）</div>
        <button id="clearEffectBtn" class="btn btn-clear" style="display:none;" onclick="clearEffect()">効果を終了する（解除）</button>
      </div>
    </div>

    <div class="card">
      <div class="tab-container">
        <button class="tab-btn active" onclick="switchTab('shop')">🔭 ショップ</button>
        <button class="tab-btn" onclick="switchTab('bag')">🎒 バッグ</button>
      </div>

      <!-- ショップタブ -->
      <div id="tab-shop" class="tab-content active">
        <div id="shopItemsContainer" class="item-grid"></div>
      </div>

      <!-- バッグタブ -->
      <div id="tab-bag" class="tab-content">
        <div id="bagItemsContainer" class="item-grid"></div>
      </div>
    </div>

    <button class="btn btn-close" onclick="liff.closeWindow()">✖️ 画面を閉じる</button>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    let myUserId = "";
    let currentTrust = 0;
    let activeEffectItemId = "";
    let ownedItems = [];
    let shopItems = [];

    function showError(message) {
      document.getElementById("loading").style.display = "none";
      const errorBox = document.getElementById("error-box");
      errorBox.style.display = "block";
      errorBox.innerHTML = "⚠️ <b>エラーが発生しました</b><br><br>" + message;
    }

    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get("userId")) {
        myUserId = urlParams.get("userId");
        loadData();
        return;
      }
      liff.init({ liffId: MY_LIFF_ID }).then(() => {
        if (!liff.isLoggedIn()) liff.login();
        else {
          liff.getProfile().then(profile => {
            myUserId = profile.userId;
            loadData();
          }).catch(err => showError("プロフィール取得エラー: " + err.message));
        }
      }).catch(err => showError("LIFF初期化エラー: " + err.message));
    });

    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      document.getElementById('tab-' + tabName).classList.add('active');
      document.querySelectorAll('.tab-btn')[tabName === 'shop' ? 0 : 1].classList.add('active');
    }

    function loadData() {
      fetch(GAS_API_URL + "?userId=" + encodeURIComponent(myUserId) + "&action=getAvatarData")
        .then(res => res.json())
        .then(data => {
          if (data.error) return showError(data.error);
          currentTrust = data.trust;
          document.getElementById("userTrust").textContent = currentTrust;

          activeEffectItemId = data.equipped || "";
          ownedItems = data.owned ? data.owned.split(',').filter(Boolean) : [];
          shopItems = data.shop || [];

          updateUI();
          document.getElementById("loading").style.display = "none";
          document.getElementById("content").style.display = "block";
        })
        .catch(err => showError("通信エラーが発生しました"));
    }

    function updateUI() {
      const activeTextEl = document.getElementById("activeEffectText");
      const clearBtnEl = document.getElementById("clearEffectBtn");
      
      if (activeEffectItemId) {
        let activeItem = shopItems.find(s => s.itemId === activeEffectItemId);
        activeTextEl.innerHTML = activeItem ? `✨ 軌道投入完了：<br>${activeItem.itemName}` : "✨ 発動中（効果あり）";
        clearBtnEl.style.display = "block";
      } else {
        activeTextEl.textContent = "なし（通常状態）";
        clearBtnEl.style.display = "none";
      }

      // ショップの描画
      const shopContainer = document.getElementById("shopItemsContainer");
      shopContainer.innerHTML = "";
      shopItems.forEach(item => {
        let div = document.createElement("div");
        div.className = "item-card";
        div.innerHTML = `
          <div>
            <div class="item-name">${item.itemName}</div>
            <div class="item-desc">${item.description || ""}</div>
            <div class="item-price">🌟 ${item.price} pt</div>
          </div>
          <button class="btn btn-buy" onclick="buyItem('${item.itemId}', ${item.price})">購入する</button>
        `;
        shopContainer.appendChild(div);
      });

      // バッグの描画
      const bagContainer = document.getElementById("bagItemsContainer");
      bagContainer.innerHTML = "";
      if (ownedItems.length === 0) {
        bagContainer.innerHTML = '<div style="grid-column: span 2; text-align: center; color: #64748b; padding: 30px 10px; font-size: 13px;">バッグにアイテムがありません。<br>ショップで星の欠片（ポイント）と交換しよう！</div>';
      } else {
        ownedItems.forEach((itemId, index) => {
          let item = shopItems.find(s => s.itemId === itemId);
          if (!item) return;

          let div = document.createElement("div");
          div.className = "item-card";
          div.innerHTML = `
            <div>
              <div class="item-name">${item.itemName}</div>
              <div class="item-desc">${item.description || ""}</div>
            </div>
            <button class="btn btn-use" onclick="useItem('${itemId}', ${index})">使用する</button>
          `;
          bagContainer.appendChild(div);
        });
      }
    }

    function buyItem(itemId, price) {
      if (currentTrust < price) return alert("ポイントが足りません！");
      if (!confirm(`本当に ${price} pt で購入しますか？`)) return;

      fetch(`${GAS_API_URL}?userId=${encodeURIComponent(myUserId)}&action=buyItem&param=${encodeURIComponent(itemId)}&subParam=${price}`)
        .then(res => res.json())
        .then(data => {
          if (data.error) return alert(data.error);
          currentTrust = data.trust;
          document.getElementById("userTrust").textContent = currentTrust;
          ownedItems = data.owned ? data.owned.split(',').filter(Boolean) : [];
          updateUI();
          alert("アイテムを購入しました！バッグに追加されました。");
        });
    }

    function useItem(itemId, index) {
      let item = shopItems.find(s => s.itemId === itemId);
      if (!confirm(`「${item.itemName}」を使用しますか？\n（※使うと消費されます）`)) return;

      ownedItems.splice(index, 1);
      let newOwnedString = ownedItems.join(',');
      activeEffectItemId = itemId;

      fetch(`${GAS_API_URL}?userId=${encodeURIComponent(myUserId)}&action=saveAvatar&param=${encodeURIComponent(activeEffectItemId)}&subParam=${encodeURIComponent(newOwnedString)}`)
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            updateUI();
            alert(`「${item.itemName}」の効果が発動しました！`);
          }
        });
    }

    function clearEffect() {
      if (!confirm("現在の効果を終了（解除）しますか？")) return;

      activeEffectItemId = "";
      fetch(`${GAS_API_URL}?userId=${encodeURIComponent(myUserId)}&action=saveAvatar&param=${encodeURIComponent("")}`)
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            updateUI();
            alert("効果を解除しました。");
          }
        });
    }
  </script>
</body>
</html>
