<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アイテムショップ ＆ 特殊効果</title>
  <style>
    body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #1a1a1a; color: #f0f0f0; padding: 20px; box-sizing: border-box; }
    .card { background-color: #2c2c2c; border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border-left: 5px solid #e74c3c; }
    h2 { margin-top: 0; color: #e74c3c; font-size: 18px; border-bottom: 1px solid #444; padding-bottom: 10px; }
    .status-item { margin: 10px 0; font-size: 15px; }
    .label { color: #aaa; font-size: 13px; }
    
    .tab-container { display: flex; margin-bottom: 15px; border-bottom: 2px solid #444; }
    .tab-btn { flex: 1; background: none; border: none; padding: 10px; color: #aaa; font-size: 14px; font-weight: bold; cursor: pointer; text-align: center; }
    .tab-btn.active { color: #e74c3c; border-bottom: 2px solid #e74c3c; margin-bottom: -2px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .active-effect-box { background: #1e1e1e; border: 1px solid #e74c3c; border-radius: 6px; padding: 12px; margin-bottom: 15px; text-align: center; }
    
    .item-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; max-height: 400px; overflow-y: auto; padding-right: 5px; }
    .item-card { background-color: #1e1e1e; border: 1px solid #444; border-radius: 6px; padding: 10px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
    .item-name { font-size: 13px; font-weight: bold; margin-bottom: 3px; color: #fff; }
    .item-desc { font-size: 11px; color: #aaa; margin-bottom: 6px; line-height: 1.3; }
    .item-price { font-size: 12px; color: #f1c40f; margin-bottom: 8px; }

    .btn { display: block; width: 100%; padding: 8px; margin: 5px 0; border: none; border-radius: 5px; font-size: 13px; font-weight: bold; color: white; cursor: pointer; }
    .btn-buy { background-color: #e67e22; }
    .btn-use { background-color: #27ae60; }
    .btn-clear { background-color: #c0392b; }
    .btn-close { background-color: #555; margin-top: 20px; }

    #loading { text-align: center; color: #aaa; margin-top: 50px; }
    #error-box { display: none; background-color: #c0392b; color: white; padding: 15px; border-radius: 5px; margin-top: 20px; font-size: 14px; word-break: break-all; }
    #content { display: none; }
  </style>
</head>
<body>
  <script>
    const MY_LIFF_ID = "2011108007-kQlpYXHL";
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwY-IBRG0C6Bn9RxsyWlMGpm0j43_8ap5pEeIOAMYNZvObbNkh4e0C88z4WPJmiRIGf/exec";
  </script>

  <div id="loading">📡 データを読み込み中...</div>
  <div id="error-box"></div>

  <div id="content">
    <div class="card">
      <h2>🍷 特殊アイテム・効果管理</h2>
      <div class="status-item"><span class="label">所持ポイント:</span> <strong id="userTrust" style="color: #f1c40f;">0</strong> pt</div>
      
      <div class="active-effect-box">
        <div style="font-size: 12px; color: #aaa; margin-bottom: 5px;">現在の有効な効果：</div>
        <div id="activeEffectText" style="font-size: 14px; font-weight: bold; color: #2ecc71; margin-bottom: 10px;">なし（通常状態）</div>
        <button id="clearEffectBtn" class="btn btn-clear" style="display:none;" onclick="clearEffect()">効果を終了する（解除）</button>
      </div>
    </div>

    <div class="card">
      <div class="tab-container">
        <button class="tab-btn active" onclick="switchTab('shop')">アイテムショップ</button>
        <button class="tab-btn" onclick="switchTab('bag')">所持アイテム（バッグ）</button>
      </div>

      <!-- ショップタブ -->
      <div id="tab-shop" class="tab-content active">
        <div id="shopItemsContainer" class="item-grid"></div>
      </div>

      <!-- バッグタブ -->
      <div id="tab-bag" class="tab-content">
        <div id="bagItemsContainer" class="item-grid"></div>
      </div>
    </div>

    <button class="btn btn-close" onclick="liff.closeWindow()">✖️ 画面を閉じる</button>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    let myUserId = "";
    let currentTrust = 0;
    let activeEffectItemId = "";
    let ownedItems = [];
    let shopItems = [];

    function showError(message) {
      document.getElementById("loading").style.display = "none";
      const errorBox = document.getElementById("error-box");
      errorBox.style.display = "block";
      errorBox.innerHTML = "⚠️ <b>エラー</b><br><br>" + message;
    }

    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get("userId")) {
        myUserId = urlParams.get("userId");
        loadData();
        return;
      }
      liff.init({ liffId: MY_LIFF_ID }).then(() => {
        if (!liff.isLoggedIn()) liff.login();
        else {
          liff.getProfile().then(profile => {
            myUserId = profile.userId;
            loadData();
          }).catch(err => showError("プロフィール取得エラー: " + err.message));
        }
      }).catch(err => showError("LIFF初期化エラー: " + err.message));
    });

    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      document.getElementById('tab-' + tabName).classList.add('active');
      document.querySelectorAll('.tab-btn')[tabName === 'shop' ? 0 : 1].classList.add('active');
    }

    function loadData() {
      fetch(GAS_API_URL + "?userId=" + encodeURIComponent(myUserId) + "&action=getAvatarData")
        .then(res => res.json())
        .then(data => {
          if (data.error) return showError(data.error);
          currentTrust = data.trust;
          document.getElementById("userTrust").textContent = currentTrust;

          activeEffectItemId = data.equipped || "";
          ownedItems = data.owned ? data.owned.split(',').filter(Boolean) : [];
          shopItems = data.shop || [];

          updateUI();
          document.getElementById("loading").style.display = "none";
          document.getElementById("content").style.display = "block";
        })
        .catch(err => showError("通信エラー"));
    }

    function updateUI() {
      const activeTextEl = document.getElementById("activeEffectText");
      const clearBtnEl = document.getElementById("clearEffectBtn");
      
      if (activeEffectItemId) {
        let activeItem = shopItems.find(s => s.itemId === activeEffectItemId);
        activeTextEl.textContent = activeItem ? `✨ 発動中：${activeItem.itemName}` : "✨ 発動中（効果あり）";
        clearBtnEl.style.display = "block";
      } else {
        activeTextEl.textContent = "なし（通常状態）";
        clearBtnEl.style.display = "none";
      }

      // ショップの描画（説明文対応）
      const shopContainer = document.getElementById("shopItemsContainer");
      shopContainer.innerHTML = "";
      shopItems.forEach(item => {
        let div = document.createElement("div");
        div.className = "item-card";
        div.innerHTML = `
          <div>
            <div class="item-name">${item.itemName}</div>
            <div class="item-desc">${item.description || ""}</div>
            <div class="item-price">🪙 ${item.price} pt</div>
          </div>
          <button class="btn btn-buy" onclick="buyItem('${item.itemId}', ${item.price})">購入する</button>
        `;
        shopContainer.appendChild(div);
      });

      // バッグの描画（説明文対応）
      const bagContainer = document.getElementById("bagItemsContainer");
      bagContainer.innerHTML = "";
      if (ownedItems.length === 0) {
        bagContainer.innerHTML = '<div style="grid-column: span 2; text-align: center; color: #777; padding: 20px;">バッグにアイテムがありません。<br>ショップで購入しよう！</div>';
      } else {
        ownedItems.forEach((itemId, index) => {
          let item = shopItems.find(s => s.itemId === itemId);
          if (!item) return;

          let div = document.createElement("div");
          div.className = "item-card";
          div.innerHTML = `
            <div>
              <div class="item-name">${item.itemName}</div>
              <div class="item-desc">${item.description || ""}</div>
            </div>
            <button class="btn btn-use" onclick="useItem('${itemId}', ${index})">使用する（効果発動）</button>
          `;
          bagContainer.appendChild(div);
        });
      }
    }

    function buyItem(itemId, price) {
      if (currentTrust < price) return alert("ポイントが足りません！");
      if (!confirm(`本当に ${price} pt で購入しますか？`)) return;

      fetch(`${GAS_API_URL}?userId=${encodeURIComponent(myUserId)}&action=buyItem&param=${encodeURIComponent(itemId)}&subParam=${price}`)
        .then(res => res.json())
        .then(data => {
          if (data.error) return alert(data.error);
          currentTrust = data.trust;
          document.getElementById("userTrust").textContent = currentTrust;
          ownedItems = data.owned ? data.owned.split(',').filter(Boolean) : [];
          updateUI();
          alert("アイテムを購入しました！バッグに追加されました。");
        });
    }

    function useItem(itemId, index) {
      let item = shopItems.find(s => s.itemId === itemId);
      if (!confirm(`「${item.itemName}」を使用しますか？\n（※使うと消費されます）`)) return;

      ownedItems.splice(index, 1);
      let newOwnedString = ownedItems.join(',');
      activeEffectItemId = itemId;

      fetch(`${GAS_API_URL}?userId=${encodeURIComponent(myUserId)}&action=saveAvatar&param=${encodeURIComponent(activeEffectItemId)}&subParam=${encodeURIComponent(newOwnedString)}`)
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            updateUI();
            alert(`「${item.itemName}」の効果が発動しました！`);
          }
        });
    }

    function clearEffect() {
      if (!confirm("現在の効果を終了（解除）しますか？")) return;

      activeEffectItemId = "";
      fetch(`${GAS_API_URL}?userId=${encodeURIComponent(myUserId)}&action=saveAvatar&param=${encodeURIComponent("")}`)
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            updateUI();
            alert("効果を解除しました。");
          }
        });
    }
  </script>
</body>
</html>
